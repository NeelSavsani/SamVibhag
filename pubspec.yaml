name: samvibhag

description: "SamVibhag - Smart Expense Splitter App"

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^4.9.0
  firebase_auth: ^6.5.1
  cloud_firestore: ^6.4.1

  # State Management
  provider: ^6.1.5+1

  # Icons
  font_awesome_flutter: ^11.0.0

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  pdf: ^3.11.0
  printing: ^5.13.4

  # Notifications
  flutter_local_notifications: ^19.4.1

  # UI
  google_fonts: ^6.3.1

  # Utilities
  intl: ^0.20.2
  uuid: ^4.5.1

  fl_chart: ^0.68.0

  # Open WhatsApp / URLs
  url_launcher: ^6.3.2

  # SVG Support
  flutter_svg: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # App Icon Generator
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/images/